[package]
name = "genesis-memory-server"
version = "0.1.0"
edition = "2021"
description = "Genesis MCP memory server — per-agent semantic memory over SQLite + local embeddings (pure-Rust tract backend)."
license = "MIT OR Apache-2.0"
publish = false

[[bin]]
name = "genesis-memory-server"
path = "src/main.rs"

[lib]
name = "genesis_memory"
path = "src/lib.rs"

[dependencies]
# MCP server (official Rust SDK). transport-io is REQUIRED for stdio(); `server` already implies macros+schemars.
rmcp       = { version = "2.2.0", features = ["server", "macros", "transport-io"] }
schemars   = "1"
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
# async runtime
tokio   = { version = "1", features = ["macros", "rt", "rt-multi-thread", "io-std", "signal"] }
anyhow  = "1"
thiserror = "2"
# vector store
# Pinned to 0.39.0 (-> libsqlite3-sys 0.37.0): 0.40.x pulls libsqlite3-sys >=0.38, whose
# build.rs uses the `cfg_select!` macro (stabilized after Rust 1.93), breaking the build on
# stable toolchains older than ~1.95. 0.37.0 is the newest libsqlite3-sys without cfg_select.
rusqlite   = { version = "=0.39.0", features = ["bundled"] }
sqlite-vec = "0.1.9"
bytemuck   = "1"
# embeddings — pure-Rust inference via the tract backend. `ort` keeps its API but the engine
# is swapped from ONNX Runtime to tract via `alternative-backend` (= ort-sys/disable-linking):
# NO download-binaries prebuilt, NO cmake, NO sidecar dylib, so the server builds for ALL
# targets — incl. x86_64-apple-darwin (Intel Mac) and {x86_64,aarch64}-unknown-linux-musl,
# for which pyke ships no ONNX Runtime prebuilt. tract loads the SAME onnx/model.onnx +
# tokenizer.json (model package unchanged). ort-tract 0.4.0 pins ort-sys =2.0.0-rc.13, and
# ort-sys is a single `links` crate, so `ort` is bumped rc.12 -> rc.13 to match; `api-17` is
# the OrtApi version tract's stub implements (tract's own tested pairing).
ort        = { version = "=2.0.0-rc.13", default-features = false, features = ["alternative-backend", "ndarray", "std", "api-17"] }
ort-tract  = "=0.4.0"
ndarray    = "0.17"
tokenizers = "0.23.1"
# logging
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[dev-dependencies]
cucumber   = { version = "0.23", features = ["macros"] }
assert_cmd = "2.2"
approx     = "0.5"
insta      = "1"
tempfile   = "3"
sha2       = "0.10"
hex        = "0.4"

# --- ifs lint gate, verbatim from denier-rust/common-rust (crate-level; genesis has no workspace) ---
[lints.rust]
# `deny` (not `forbid`) so exactly ONE sanctioned FFI exception is possible: registering the
# sqlite-vec extension via `sqlite3_auto_extension(sqlite3_vec_init)` (spec §2.3b Vector-store
# requirement) is inherently unsafe and has no safe wrapper. It carries a scoped
# `#[allow(unsafe_code)]` on `VectorStore::open`; unsafe stays denied everywhere else.
unsafe_code = "deny"
missing_docs = "warn"
unreachable_pub = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "warn"      # so unimplemented!() scaffold stubs compile
module_name_repetitions = "allow"
missing_errors_doc = "warn"
missing_panics_doc = "warn"
# doc_markdown is a purely cosmetic pedantic lint: it flags ordinary technical nouns in doc
# prose (SQLite, ONNX, sqlite-vec, token_type_ids) for want of backticks. Zero correctness
# value; allowed so `clippy -D warnings` gates on substance. Every other pedantic lint stays on.
doc_markdown = "allow"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "unwind"
strip = "debuginfo"

# ─────────────────────────────────────────────────────────────────────────────
# cucumber BDD suites are harness=false bins (one per tool feature, plus one for the
# protocol/lifecycle criteria that belong to no single tool). Generated by /spec-compile
# (Rust branch) together with the matching tests/bdd/<slug>_steps.rs file. Each runner
# resolves its .feature via "../test/features/<slug>.feature" — [[test]] targets run with
# the package root (server/) as their working directory, and the features live at repo root.
# ─────────────────────────────────────────────────────────────────────────────

[[test]]
name = "bdd_store"
path = "tests/bdd/store_steps.rs"
harness = false

[[test]]
name = "bdd_recall"
path = "tests/bdd/recall_steps.rs"
harness = false

[[test]]
name = "bdd_consolidate"
path = "tests/bdd/consolidate_steps.rs"
harness = false

[[test]]
name = "bdd_server"
path = "tests/bdd/server_steps.rs"
harness = false
