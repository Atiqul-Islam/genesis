name: release

# On a version tag (v*), build the self-contained genesis-memory-server for every supported
# platform, stage each binary into its npm platform package, package the pinned ONNX model,
# then publish everything to npm with provenance. The plugin's .mcp.json launches the server
# via `npx -y @xcidos/genesis-memory-server`, which npm resolves to the one matching platform
# package (os/cpu/libc-gated) + the shared model package. No GitHub-Releases assets, no
# checksum pinning, no Python launcher — that model is retired.
#
# The inference engine is the pure-Rust tract backend (ort `alternative-backend` + `ort-tract`),
# so EVERY target builds from one path with no prebuilt runtime, no cmake, and no sidecar
# dylib: there is no ONNX-Runtime download-binaries matrix to special-case, and the two targets
# ONNX Runtime never shipped a prebuilt for — x86_64-apple-darwin and the musl targets — now
# build like any other. Each binary is SELF-CONTAINED: inference is compiled in (tract, pure
# Rust), SQLite is compiled in (rusqlite `bundled`), and the Windows CRT is static (+crt-static
# via server/.cargo/config.toml). So a platform package is exactly one file and needs no sidecar.
#
# REQUIRED SECRETS:
#   NPM_TOKEN            npm automation token with publish rights to the @xcidos scope
#   (macOS signing, optional — ad-hoc signed if absent, which runs locally but not via Gatekeeper)
#   APPLE_CERT_P12_BASE64, APPLE_CERT_PASSWORD, APPLE_SIGN_IDENTITY,
#   APPLE_NOTARY_APPLE_ID, APPLE_NOTARY_TEAM_ID, APPLE_NOTARY_PASSWORD

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build (e.g. v0.1.0)"
        required: true

permissions:
  contents: read
  id-token: write        # npm provenance (Sigstore via GitHub OIDC)

env:
  BIN_STEM: genesis-memory-server

jobs:
  # ── One self-contained binary per platform, staged into its npm package dir ────────────
  build:
    name: build ${{ matrix.key }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60     # bound any single target (e.g. a slow/absent arm64 runner) so it can't hang publish
    strategy:
      fail-fast: false      # keep every platform independent — one target failing never sinks the rest
      matrix:
        # tract is pure Rust, so target choice is purely about host arch vs. cross/glibc-floor:
        # native `cargo` when the runner matches the target arch, `cargo-zigbuild` for cross,
        # musl (fully static), and the low-glibc gnu floor. No ORT-prebuilt gating anywhere.
        # ALPHA scope: the 5 targets that build cleanly. ARM64-Linux (gnu+musl) and Windows-ARM are
        # DEFERRED — tract-linalg's hand-written ARM64 SIMD (SVE C + asm) does not cross-compile via
        # zig or MSVC-on-an-x64-host; they need native ARM runners (a follow-up). The launcher still
        # lists all 8 in optionalDependencies, so ARM users get a clean "unsupported" message until
        # those platform packages are published.
        include:
          - { key: darwin-arm64,  runner: macos-14,       target: aarch64-apple-darwin,      tool: cargo }
          - { key: darwin-x64,    runner: macos-14,       target: x86_64-apple-darwin,       tool: cargo }    # cross-compiled on Apple Silicon — macos-13 Intel runners queue for ages; x64 codegen/SIMD is fine (only ARM64 asm was the problem)
          - { key: linux-x64-gnu, runner: ubuntu-22.04,   target: x86_64-unknown-linux-gnu,  tool: cargo }    # glibc 2.35 floor
          - { key: linux-x64-musl,runner: ubuntu-22.04,   target: x86_64-unknown-linux-musl, tool: zigbuild } # fully static
          - { key: win32-x64,     runner: windows-latest, target: x86_64-pc-windows-msvc,    tool: cargo }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Install Rust (pinned by rust-toolchain.toml) + target
        shell: bash
        run: |
          rustup show
          rustup target add "${{ matrix.target }}"
          rustc --version && cargo --version

      - name: Install zig + cargo-zigbuild (cross + glibc-floor + musl)
        if: matrix.tool == 'zigbuild'
        shell: bash
        run: |
          # Pin zig 0.13.0 (the version cargo-zigbuild builds cleanly with; `pip install ziglang`
          # pulls 0.16.0 AND never exposes a `zig` on PATH -> "Failed to find zig"). Host is x64
          # ubuntu; zig cross-compiles to the musl/arm targets. Put it on PATH via GITHUB_PATH.
          ZIG=0.13.0
          curl -fsSL "https://ziglang.org/download/${ZIG}/zig-linux-x86_64-${ZIG}.tar.xz" -o /tmp/zig.tar.xz
          mkdir -p "$HOME/zig" && tar -xf /tmp/zig.tar.xz -C "$HOME/zig" --strip-components=1
          echo "$HOME/zig" >> "$GITHUB_PATH"
          "$HOME/zig/zig" version
          cargo install --locked cargo-zigbuild

      - name: Build (cargo)
        if: matrix.tool == 'cargo'
        shell: bash
        working-directory: server
        run: cargo build --release --target "${{ matrix.target }}" --bin "$BIN_STEM"

      - name: Build (zigbuild)
        if: matrix.tool == 'zigbuild'
        shell: bash
        working-directory: server
        run: |
          # Pin a low glibc floor for the gnu cross target so it runs on old distros;
          # musl targets are fully static and take no floor suffix.
          case "${{ matrix.target }}" in
            *-linux-gnu) tgt="${{ matrix.target }}.2.17" ;;
            *)           tgt="${{ matrix.target }}" ;;
          esac
          cargo zigbuild --release --target "$tgt" --bin "$BIN_STEM"

      - name: Locate built binary
        id: bin
        shell: bash
        run: |
          ext=""; [ "${{ startsWith(matrix.key, 'win32') }}" = "true" ] && ext=".exe"
          src="server/target/${{ matrix.target }}/release/${BIN_STEM}${ext}"
          test -f "$src" || { echo "missing built binary: $src"; exit 1; }
          echo "src=$src"  >> "$GITHUB_OUTPUT"
          echo "file=${BIN_STEM}${ext}" >> "$GITHUB_OUTPUT"

      - name: Verify self-contained (no inference-runtime sidecar)   # Linux/macOS best-effort
        if: startsWith(matrix.key, 'win32') == false
        shell: bash
        run: |
          # tract is compiled in, so the binary must never link a dynamic inference runtime.
          # This is a regression guard: it fails if anyone re-enables an ONNX-Runtime/DirectML
          # linking backend, which would reintroduce the missing-prebuilt targets this swap fixed.
          f="${{ steps.bin.outputs.src }}"
          if (otool -L "$f" 2>/dev/null || ldd "$f" 2>/dev/null) | grep -iE "onnxruntime|directml"; then
            echo "ERROR: binary links a dynamic inference runtime (expected pure-Rust tract)"; exit 1
          fi
          echo "ok: self-contained (pure-Rust tract inference, no sidecar)"

      - name: Sign + notarize (macOS)
        if: startsWith(matrix.key, 'darwin')
        shell: bash
        env:
          P12: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          P12_PW: ${{ secrets.APPLE_CERT_PASSWORD }}
          IDENTITY: ${{ secrets.APPLE_SIGN_IDENTITY }}
          NOTARY_ID: ${{ secrets.APPLE_NOTARY_APPLE_ID }}
          NOTARY_TEAM: ${{ secrets.APPLE_NOTARY_TEAM_ID }}
          NOTARY_PW: ${{ secrets.APPLE_NOTARY_PASSWORD }}
        run: |
          f="${{ steps.bin.outputs.src }}"
          if [ -n "$P12" ] && [ -n "$IDENTITY" ]; then
            kc="$RUNNER_TEMP/build.keychain"; kp="ci-$RANDOM"
            security create-keychain -p "$kp" "$kc"
            security set-keychain-settings -lut 21600 "$kc"
            security unlock-keychain -p "$kp" "$kc"
            echo "$P12" | base64 -d > "$RUNNER_TEMP/cert.p12"
            security import "$RUNNER_TEMP/cert.p12" -k "$kc" -P "$P12_PW" -T /usr/bin/codesign
            security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$kp" "$kc"
            codesign --force --options runtime --timestamp --sign "$IDENTITY" "$f"
            if [ -n "$NOTARY_ID" ]; then
              ditto -c -k "$f" "$RUNNER_TEMP/nz.zip"
              xcrun notarytool submit "$RUNNER_TEMP/nz.zip" --apple-id "$NOTARY_ID" \
                --team-id "$NOTARY_TEAM" --password "$NOTARY_PW" --wait
              # A bare executable can't be stapled; the notarization ticket is served online.
            fi
          else
            echo "No Apple signing secrets — ad-hoc signing (runs locally; not Gatekeeper-cleared)."
            codesign --force --sign - "$f"
          fi

      - name: Stage into npm platform package
        shell: bash
        run: |
          dest="npm/@xcidos/genesis-memory-server-${{ matrix.key }}"
          test -d "$dest" || { echo "missing package dir: $dest"; exit 1; }
          cp "${{ steps.bin.outputs.src }}" "$dest/${{ steps.bin.outputs.file }}"
          chmod +x "$dest/${{ steps.bin.outputs.file }}" || true

      - name: Upload staged binary
        uses: actions/upload-artifact@v4
        with:
          name: pkgbin-${{ matrix.key }}
          path: npm/@xcidos/genesis-memory-server-${{ matrix.key }}/${{ steps.bin.outputs.file }}
          if-no-files-found: error
          retention-days: 1

  # ── Package the pinned ONNX model once (platform-independent) ──────────────────────────
  model:
    name: package model
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Cache the pinned model (avoids re-hitting HuggingFace every run)
        uses: actions/cache@v4
        with:
          path: |
            npm/@xcidos/genesis-memory-model/onnx/model.onnx
            npm/@xcidos/genesis-memory-model/tokenizer.json
          key: model-pkg-${{ hashFiles('scripts/fetch-model.mjs') }}
      - name: Fetch + verify the pinned model into the model package
        shell: bash
        run: |
          if [ -f npm/@xcidos/genesis-memory-model/onnx/model.onnx ]; then
            echo "model restored from cache — skipping download"
          else
            # HuggingFace returns 429 under repeated release runs; retry with backoff.
            ok=""
            for wait in 0 20 45 90 180; do
              [ "$wait" = "0" ] || { echo "HF rate-limited; retrying in ${wait}s..."; sleep "$wait"; }
              if node scripts/fetch-model.mjs --dest npm/@xcidos/genesis-memory-model; then ok=1; break; fi
            done
            [ -n "$ok" ] || { echo "model fetch failed after retries"; exit 1; }
          fi
      - name: Sanity-check the two shipped files exist
        shell: bash
        run: |
          test -f npm/@xcidos/genesis-memory-model/onnx/model.onnx
          test -f npm/@xcidos/genesis-memory-model/tokenizer.json
      - uses: actions/upload-artifact@v4
        with:
          name: model-files
          path: |
            npm/@xcidos/genesis-memory-model/onnx/model.onnx
            npm/@xcidos/genesis-memory-model/tokenizer.json
          if-no-files-found: error
          retention-days: 1

  # ── Collect artifacts, sync versions, publish to npm in dependency order ───────────────
  publish:
    name: publish to npm
    runs-on: ubuntu-22.04
    needs: [build, model]
    # Publish whatever built: a single straggler target must not block the whole release. Runs as
    # long as the model built; the publish step skips any platform package whose binary is absent,
    # and npm treats a missing optionalDependency as non-fatal at install time.
    if: ${{ always() && needs.model.result == 'success' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: "https://registry.npmjs.org"

      - name: Resolve version from tag
        id: ver
        shell: bash
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Restore staged platform binaries
        uses: actions/download-artifact@v4
        with:
          pattern: pkgbin-*
          path: staging-bins

      - name: Restore model files
        uses: actions/download-artifact@v4
        with:
          name: model-files
          path: npm/@xcidos/genesis-memory-model

      - name: Reassemble binaries into their package dirs
        shell: bash
        run: |
          # download-artifact restores each under staging-bins/pkgbin-<key>/<binfile>.
          for d in staging-bins/pkgbin-*; do
            key="${d#staging-bins/pkgbin-}"
            dest="npm/@xcidos/genesis-memory-server-$key"
            mkdir -p "$dest"
            f="$(ls "$d")"
            cp "$d/$f" "$dest/$f"
            chmod +x "$dest/$f" || true
            echo "staged $dest/$f"
          done

      - name: Sync all package versions to the release version
        run: node npm/scripts/generate-platform-packages.mjs "${{ steps.ver.outputs.version }}"

      - name: Publish (platform packages first, then model, then launcher)
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -e
          publish_dir() {
            ( cd "$1" && npm publish --provenance --access public ) \
              || echo "skip $1 (already published or nothing to publish)"
          }
          # 1) only the platform packages whose binary actually built this run
          for d in npm/@xcidos/genesis-memory-server-*/; do
            case "$d" in */genesis-memory-server/) continue;; esac   # skip the launcher dir
            bin="${d}genesis-memory-server"; [ -f "${d}genesis-memory-server.exe" ] && bin="${d}genesis-memory-server.exe"
            if [ -f "$bin" ]; then publish_dir "$d"; else echo "no binary for $d — not built, skipping"; fi
          done
          # 2) the shared model (a hard dependency of the launcher)
          publish_dir npm/@xcidos/genesis-memory-model
          # 3) the launcher LAST — its exact-version deps must already resolve on the registry
          publish_dir npm/@xcidos/genesis-memory-server
