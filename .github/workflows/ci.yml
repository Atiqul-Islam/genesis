name: ci

# Build + test on every push/PR (tags are handled by release.yml). Nothing is published here.
# Two gates: the Rust memory server compiles + its suite passes on all three primary OSes, and
# the Node plugin surface (hooks, installer, session-copy, npm launcher) parses + its unit tests
# pass. This is the guard that would have caught the cross-platform defects found in audit
# (Windows unix-only test import, python3 hardcoding, etc.) before they reached a release.

on:
  push:
    branches: ["**"]
    tags-ignore: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  # ── Rust server: compile + test + a real launcher smoke on each primary OS ─────────────
  rust:
    name: rust ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-22.04, macos-14, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (pinned by rust-toolchain.toml)
        shell: bash
        run: rustup show && rustc --version && cargo --version

      - uses: actions/setup-node@v4
        with: { node-version: 24 }   # node:sqlite (session_copy) is unflagged on Node 24; Node 20 lacks it

      - name: Cache the pinned model
        uses: actions/cache@v4
        with:
          path: server/models
          key: model-${{ hashFiles('scripts/fetch-model.mjs') }}

      - name: Fetch model (if not cached)
        shell: bash
        run: |
          if [ ! -f server/models/onnx/model.onnx ]; then
            node scripts/fetch-model.mjs
          fi

      - name: Build
        shell: bash
        working-directory: server
        run: cargo build --release

      - name: Test
        shell: bash
        working-directory: server
        run: cargo test --release

      - name: Node integration tests against the built server (session-copy)
        shell: bash
        env:
          GENESIS_MODEL_DIR: ${{ github.workspace }}/server/models
        run: |
          ext=""; [ "${{ runner.os }}" = "Windows" ] && ext=".exe"
          export GENESIS_MEMORY_BIN="$PWD/server/target/release/genesis-memory-server$ext"
          for t in session_copy/test_embed.js session_copy/test_pipeline.js session_copy/test_build_session_agent.js; do
            echo "== $t =="; node "$t"
          done

  # ── Node plugin surface: parse-check everything + run the pure-Node unit tests ─────────
  node:
    name: node lint + unit tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }   # node:sqlite (session_copy) is unflagged on Node 24; Node 20 lacks it

      - name: Parse-check all JS/MJS (hooks, installer, session-copy, npm launcher, scripts)
        shell: bash
        run: |
          fail=0
          while IFS= read -r -d '' f; do
            node --check "$f" || { echo "SYNTAX FAIL: $f"; fail=1; }
          done < <(find hooks install session_copy scripts test npm -type f \( -name '*.js' -o -name '*.mjs' \) -print0)
          exit $fail

      - name: Hook + installer + tooling unit tests (no server needed)
        shell: bash
        run: |
          set -e
          for t in \
            hooks/test_gate.js hooks/test_inject.js hooks/test_validate.js hooks/test_review.js \
            hooks/test_adherence.js hooks/test_enforce_research.js hooks/test_session_pointer.js \
            hooks/test_plugin.js hooks/test_vendored_skills.js \
            install/test_bootstrap.js install/test_portability.js \
            session_copy/test_capture.js session_copy/test_store.js \
            npm/@xcidos/genesis-memory-server/test/launcher.test.js; do
            if [ -f "$t" ]; then echo "== $t =="; node "$t"; else echo "skip (absent): $t"; fi
          done

      - name: Assert the plugin is Python-free (no runtime .py)
        shell: bash
        run: |
          hits="$(find hooks install session_copy scripts team npm commands agents -name '*.py' 2>/dev/null || true)"
          if [ -n "$hits" ]; then echo "unexpected Python files:"; echo "$hits"; exit 1; fi
          echo "ok: no runtime Python"
